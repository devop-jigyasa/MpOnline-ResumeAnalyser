name: CI / CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Verify Solution
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore MpOnline.ResumeAnalyser.sln

    - name: Build Solution (Release)
      run: dotnet build MpOnline.ResumeAnalyser.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test --configuration Release --no-build --verbosity normal || echo "No unit tests to execute"

  docker-verify:
    name: Verify Container Builds
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build API Docker Image
      run: docker build -f MpOnline.ResumeAnalyser.API/Dockerfile -t mponline-api:latest .

    - name: Build Web Docker Image
      run: docker build -f MpOnline.ResumeAnalyser.Web/Dockerfile -t mponline-web:latest .
